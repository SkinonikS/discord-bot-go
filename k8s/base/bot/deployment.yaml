apiVersion: apps/v1
kind: Deployment
metadata:
  name: discord-bot
  namespace: discord-bot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: discord-bot
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: discord-bot
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:18-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres -p 5432; do
                echo waiting for postgres
                sleep 2
              done
        - name: wait-for-lavalink
          image: busybox:1.37
          env:
            - name: LAVALINK_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: discord-bot-secret
                  key: LAVALINK_MAIN_NODE_PASSWORD
          command:
            - sh
            - -c
            - |
              until wget -qO- --header="Authorization: $LAVALINK_PASSWORD" http://lavalink:2333/version; do
                echo waiting for lavalink
                sleep 2
              done
      containers:
        - name: discord-bot
          image: ghcr.io/skinoniks/discord-bot:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: discord-bot-config
            - secretRef:
                name: discord-bot-secret
          resources:
            requests:
              memory: "256Mi"
              cpu: "500m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          volumeMounts:
            - name: storage
              mountPath: /app/storage
          readinessProbe:
            httpGet:
              port: 8081
              path: "/readyz"
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              port: 8081
              path: "/livez"
            initialDelaySeconds: 10
            periodSeconds: 20
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: discord-bot-storage
