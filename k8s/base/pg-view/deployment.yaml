apiVersion: apps/v1
kind: Deployment
metadata:
  name: pg-view
  namespace: discord-bot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pg-view
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: pg-view
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:18-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres -p 5432; do
                echo waiting for postgres
                sleep 2
              done
      containers:
        - name: pg-view
          image: lcurrol/pg-view:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: discord-bot-secret
                  key: DB_POSTGRES_HOST
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: discord-bot-secret
                  key: DB_POSTGRES_PORT
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: discord-bot-secret
                  key: DB_POSTGRES_DB
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: discord-bot-secret
                  key: DB_POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: discord-bot-secret
                  key: DB_POSTGRES_PASSWORD
            - name: PGVIEW_USERNAME
              valueFrom:
                secretKeyRef:
                  name: discord-bot-secret
                  key: PGVIEW_USERNAME
            - name: PGVIEW_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: discord-bot-secret
                  key: PGVIEW_PASSWORD
            - name: PGVIEW_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: discord-bot-secret
                  key: PGVIEW_SESSION_SECRET
            - name: PGVIEW_READ_ONLY
              value: "false"
          volumeMounts:
            - name: data
              mountPath: /app/.data
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          readinessProbe:
            httpGet:
              port: http
              path: "/"
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              port: http
              path: "/"
            initialDelaySeconds: 10
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pg-view-data
