name: Deploy

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths-ignore:
      - "**.md"

env:
  REGISTRY: ghcr.io

jobs:
  setup-output-vars:
    name: Set up output variables
    runs-on: ubuntu-latest

    outputs:
      OWNER_LC: ${{ steps.set_outputs.outputs.OWNER_LC }}
      BOT_IMAGE: ${{ steps.set_outputs.outputs.BOT_IMAGE }}
      GIT_SHORT_SHA: ${{ steps.set_outputs.outputs.GIT_SHORT_SHA }}

    steps:
      - id: set_outputs
        name: Set necessary output variables
        run: |
          OWNER_LC="${OWNER,,}"
          BOT_IMAGE="${REGISTRY}/${OWNER_LC}/discord-bot"
          GIT_SHORT_SHA="${GITHUB_SHA::7}"
          
          echo "OWNER_LC=${OWNER_LC}" >> $GITHUB_OUTPUT
          echo "BOT_IMAGE=${BOT_IMAGE}" >> $GITHUB_OUTPUT
          echo "GIT_SHORT_SHA=${GIT_SHORT_SHA}" >> $GITHUB_OUTPUT
        env:
          OWNER: '${{ github.repository_owner }}'
          REGISTRY: '${{ env.REGISTRY }}'

  test:
    name: Run tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: discord_bot
          POSTGRES_PASSWORD: root
          POSTGRES_DB: discord_bot
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      lavalink:
        image: ghcr.io/lavalink-devs/lavalink:4
        env:
          SERVER_PORT: 2333
          LAVALINK_SERVER_PASSWORD: root
          LAVALINK_SERVER_SOURCES_YOUTUBE: "false"
          LAVALINK_PLUGINS_0_DEPENDENCY: "dev.lavalink.youtube:youtube-plugin:1.18.0"
          LAVALINK_PLUGINS_0_SNAPSHOT: "false"
          LAVALINK_PLUGINS_1_DEPENDENCY: "com.github.topi314.lavaqueue:lavaqueue-plugin:176e311"
          LAVALINK_PLUGINS_1_SNAPSHOT: "true"
        ports:
          - 2333:2333
        options: >-
          --health-cmd "wget -q -O- --header='Authorization: root' http://localhost:2333/version || exit 1"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 10
          --health-start-period 30s

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libopus-dev libopusfile-dev gcc g++ pkg-config git curl unzip cmake make nasm

      - name: Install libdave
        env:
          LIBDAVE_VERSION: v1.1.1
        run: |
          git clone https://github.com/disgoorg/godave /tmp/godave
          cd /tmp/godave/scripts
          SHELL=/bin/sh ./libdave_install.sh ${LIBDAVE_VERSION}
          echo "PKG_CONFIG_PATH=$HOME/.local/lib/pkgconfig" >> $GITHUB_ENV

      - name: Download dependencies
        run: go mod download

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      - name: Run tests
        run: CGO_ENABLED=1 go test -v -race -count=1 ./...
        env:
          DB_POSTGRES_HOST: "${{ job.services.postgres.host }}"
          DB_POSTGRES_PORT: ${{ job.services.postgres.ports[5432] }}
          DB_POSTGRES_USER: discord_bot
          DB_POSTGRES_PASSWORD: root
          DB_POSTGRES_DB: discord_bot
          DB_POSTGRES_SSLMODE: disable
          LAVALINK_MAIN_NODE_HOST: "${{ job.services.lavalink.host }}"
          LAVALINK_MAIN_NODE_PORT: ${{ job.services.lavalink.ports[2333] }}
          LAVALINK_MAIN_NODE_PASSWORD: root
          LAVALINK_MAIN_NODE_SECURE: false

  build-push:
    name: Build & push bot image
    runs-on: ubuntu-latest
    needs:
      - test
      - setup-output-vars
    permissions:
      contents: read
      packages: write
    env:
      BOT_IMAGE: ${{ needs.setup-output-vars.outputs.BOT_IMAGE }}
      GIT_SHORT_SHA: ${{ needs.setup-output-vars.outputs.GIT_SHORT_SHA }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.BOT_IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short,prefix=
          annotations: |
            org.opencontainers.image.description=Discord Bot

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push bot image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GIT_COMMIT=${{ env.GIT_SHORT_SHA }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}
            TAG=${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}

  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    if: github.ref_type != 'tag'
    needs:
      - build-push
      - setup-output-vars
    env:
      BOT_IMAGE: ${{ needs.setup-output-vars.outputs.BOT_IMAGE }}
      GIT_SHORT_SHA: ${{ needs.setup-output-vars.outputs.GIT_SHORT_SHA }}
    environment: Production

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
          tags: tag:ci

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Set up kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Create production config.env
        working-directory: k8s/overlays/prod
        run: |
          touch config.env
          echo "APP_ENV=${{ vars.APP_ENV }}" >> config.env
          echo "APP_DEBUG=${{ vars.APP_DEBUG }}" >> config.env
          echo "APP_NAME=${{ vars.APP_NAME }}" >> config.env
          echo "APP_REPOSITORY=${{ github.server_url }}/${{ github.repository }}" >> config.env
          echo "LOG_LEVEL=${{ vars.LOG_LEVEL }}" >> config.env
          echo "LOG_DISABLE=${{ vars.LOG_DISABLE }}" >> config.env
          echo "DISCORD_WORKER_COUNT=${{ vars.DISCORD_WORKER_COUNT }}" >> config.env
          echo "DISCORD_APP_ID=${{ vars.DISCORD_APP_ID }}" >> config.env
          echo "CB_SERVER_NAME=${{ vars.CB_SERVER_NAME }}" >> config.env
          echo "CB_ADMIN_NAME=${{ vars.CB_ADMIN_NAME }}" >> config.env

      - name: Create production secrets.env
        working-directory: k8s/overlays/prod
        run: |
          touch secrets.env
          echo "DB_POSTGRES_USER=${{ secrets.DB_POSTGRES_USER }}" >> secrets.env
          echo "DB_POSTGRES_PASSWORD=${{ secrets.DB_POSTGRES_PASSWORD }}" >> secrets.env
          echo "DB_POSTGRES_DB=${{ secrets.DB_POSTGRES_DB }}" >> secrets.env
          echo "DB_POSTGRES_SSLMODE=${{ secrets.DB_POSTGRES_SSLMODE }}" >> secrets.env
          echo "DISCORD_TOKEN=${{ secrets.DISCORD_TOKEN }}" >> secrets.env
          echo "LAVALINK_MAIN_NODE_PASSWORD=${{ secrets.LAVALINK_MAIN_NODE_PASSWORD }}" >> secrets.env
          echo "CB_ADMIN_PASSWORD=${{ secrets.CB_ADMIN_PASSWORD }}" >> secrets.env

      - name: Update bot image
        run: kustomize edit set image ${{ env.BOT_IMAGE }}:${{ env.GIT_SHORT_SHA }}
        working-directory: k8s/overlays/prod

      - name: Apply manifests
        run: kubectl apply -k .
        working-directory: k8s/overlays/prod

      - name: Wait for rollout
        run: kubectl rollout status deployment/discord-bot -n discord-bot --timeout=120s
